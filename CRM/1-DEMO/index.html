<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CRM Playa Blanca — Pipeline</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2228%22 fill=%22%236d5ef0%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ebf1; --panel:#ffffff; --side:#fbfbfd; --text:#151a26; --mut:#6b7280; --mut2:#9aa1ae;
  --line:#edeef2; --line2:#e5e7ec; --accent:#6d5ef0; --accent-soft:#efeefe;
  --mint:#e7f8f0; --mint-t:#10b981;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --shadow-card:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.06);
  --shadow-lg:0 8px 24px rgba(16,24,40,.10),0 24px 60px rgba(16,24,40,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ic.sm{width:15px;height:15px}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}

/* ---------- SIDEBAR ---------- */
.side{background:var(--side);border-right:1px solid var(--line2);padding:18px 14px;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 16px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6d5ef0,#9b7cff);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(109,94,240,.35)}
.brand .logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2}
.brand b{font-weight:800;font-size:1.05rem;letter-spacing:-.02em;flex:1;line-height:1}
.brand .collapse{color:var(--mut2);cursor:pointer;padding:4px;border-radius:6px}
.brand .collapse:hover{background:var(--line)}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;margin-bottom:16px;color:var(--mut2)}
.search input{border:0;background:none;outline:none;color:var(--text);font-family:inherit;font-size:.88rem;width:100%}
.search .keys{display:flex;gap:3px}
.search .keys span{background:var(--bg);border:1px solid var(--line2);border-radius:5px;font-size:.66rem;font-weight:700;color:var(--mut);padding:2px 5px;line-height:1}
.navlabel{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--mut2);padding:14px 10px 7px;font-weight:700}
.navi{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:10px;color:var(--mut);font-weight:500;cursor:pointer;transition:.14s;font-size:.9rem;margin-bottom:1px}
.navi:hover{background:var(--line);color:var(--text)}
.navi.on{background:#151a26;color:#fff;font-weight:600;box-shadow:0 6px 14px rgba(21,26,38,.22)}
.navi .ic{width:18px;height:18px}
.side .spacer{flex:1}

/* ---------- MAIN ---------- */
.main{background:var(--panel);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{padding:16px 26px 0;border-bottom:1px solid var(--line);position:relative}
.savebar{position:absolute;top:16px;right:26px}
.ghostbtn{border:1px solid var(--line2);background:#fff;color:var(--mut);font-family:inherit;font-weight:600;font-size:.82rem;padding:8px 14px;border-radius:9px;cursor:pointer;transition:.14s}
.ghostbtn:hover{border-color:var(--accent);color:var(--accent)}
.h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.filters{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#fff;color:var(--text);font-family:inherit;font-weight:600;font-size:.84rem;padding:8px 13px;border-radius:10px;cursor:pointer;transition:.14s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn .ic{color:var(--mut)}
.fbtn:hover .ic{color:var(--accent)}
.clear{color:var(--accent);font-weight:700;font-size:.84rem;cursor:pointer;padding:8px 6px}
.fspace{flex:1}
.simbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:linear-gradient(135deg,#6d5ef0,#8b6cff);color:#fff;font-family:inherit;font-weight:700;font-size:.86rem;padding:9px 16px;border-radius:10px;cursor:pointer;box-shadow:0 6px 16px rgba(109,94,240,.35);transition:.14s}
.simbtn:hover{filter:brightness(1.07)}
.simbtn .ic{color:#fff}
.subbar{display:flex;align-items:center;gap:16px;padding:4px 0 14px}
.toggle{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
.toggle button{display:inline-flex;align-items:center;gap:7px;border:0;background:none;font-family:inherit;font-weight:600;font-size:.84rem;color:var(--mut);padding:7px 14px;border-radius:8px;cursor:pointer;transition:.14s}
.toggle button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.money{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:10px;padding:8px 15px;font-size:.86rem;font-weight:700;background:#fff}
.money .g{color:var(--mint-t)}
.money .l{color:var(--mut2);font-weight:600}

/* ---------- BOARD ---------- */
.board{flex:1;overflow-x:auto;overflow-y:hidden;padding:20px 26px 26px;display:flex;gap:18px;align-items:flex-start}
.board::-webkit-scrollbar{height:10px}
.board::-webkit-scrollbar-thumb{background:#d3d6de;border-radius:10px;border:3px solid var(--panel)}
.col{flex:0 0 306px;max-height:100%;display:flex;flex-direction:column}
.col-bar{height:4px;border-radius:4px 4px 0 0;background:var(--c);margin:0 2px}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 4px 12px}
.stage{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:9px;padding:6px 12px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow)}
.stage .ic{color:var(--c)}
.col-head .n{color:var(--mut2);font-weight:700;font-size:.8rem;background:var(--bg);border-radius:20px;padding:2px 9px}
.col-head .sp{flex:1}
.col-head .act{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--mut);cursor:pointer;transition:.14s}
.col-head .act:hover{color:var(--accent);border-color:var(--accent)}
.cards{display:flex;flex-direction:column;gap:12px;overflow-y:auto;padding:2px;flex:1}
.cards::-webkit-scrollbar{width:6px}
.cards::-webkit-scrollbar-thumb{background:#dcdfe6;border-radius:6px}

/* ---------- CARD ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 15px 13px;box-shadow:var(--shadow-card);position:relative;transition:.16s}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card .menu{position:absolute;top:12px;right:13px;color:var(--mut2);cursor:pointer}
.card .r1{display:flex;align-items:center;gap:10px;margin-bottom:11px;padding-right:22px}
.card .blogo{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.72rem;flex:0 0 26px}
.card .bname{font-weight:800;font-size:.94rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .hot{font-size:.85rem}
.card .r1 .sp{flex:1}
.money-pill{background:var(--mint);color:var(--mint-t);font-weight:800;font-size:.82rem;padding:4px 10px;border-radius:8px;white-space:nowrap}
.card .r2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.tag{font-weight:700;font-size:.74rem;padding:4px 11px;border-radius:7px;white-space:nowrap}
.tag-amber{background:#fdf1e3;color:#d97706}
.tag-blue{background:#e7f0ff;color:#2f6dff}
.tag-pink{background:#fce7f3;color:#db2777}
.tag-teal{background:#dff7f3;color:#0d9488}
.tag-purple{background:#efeafe;color:#7c5cfc}
.meta{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:.78rem;white-space:nowrap}
.meta .ic{color:var(--mut2)}
.card .r3{display:flex;align-items:center;gap:6px;margin-bottom:13px}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.avatars{display:flex;align-items:center}
.avatars .av{width:27px;height:27px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.66rem;margin-left:-8px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.avatars .av:first-child{margin-left:0}
.avatars .more{width:27px;height:27px;border-radius:50%;border:2px solid #fff;background:var(--bg);color:var(--mut);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.62rem;margin-left:-8px}
.actions{display:flex;gap:7px}
.actions button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;color:#3a4150;cursor:pointer;transition:.14s}
.actions button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.add-pipe{margin-top:12px;border:1px dashed var(--line2);background:#fff;color:var(--mut);font-family:inherit;font-weight:700;font-size:.84rem;padding:11px;border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.14s}
.add-pipe:hover{border-color:var(--accent);color:var(--accent)}
.newcard{animation:drop .55s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{0%{opacity:0;transform:translateY(-14px) scale(.97);box-shadow:0 0 0 3px var(--accent-soft)}100%{opacity:1;transform:none}}

/* ---------- TOAST ---------- */
.toasts{position:fixed;bottom:22px;right:22px;z-index:100;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border:1px solid var(--line2);border-left:4px solid var(--mint-t);border-radius:12px;box-shadow:var(--shadow-lg);padding:13px 16px;min-width:310px;max-width:390px;animation:slidein .35s ease}
.toast b{font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.toast .steps{font-size:.78rem;color:var(--mut);line-height:1.7}
.toast .steps .ok{color:var(--mint-t);font-weight:800}
@keyframes slidein{0%{transform:translateX(120%);opacity:0}100%{transform:none;opacity:1}}

@media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.savebar{display:none}}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l3 3-3 3-3-3z"/><path d="M6 9l3 3-3 3-3-3z"/><path d="M18 9l3 3-3 3-3-3z"/><path d="M12 15l3 3-3 3-3-3z"/></svg></div>
      <b>Playa Blanca</b>
      <span class="collapse"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
    </div>
    <div class="search">
      <svg class="ic sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input placeholder="Buscar lead...">
      <span class="keys"><span>⌘</span><span>F</span></span>
    </div>

    <div class="navlabel">Principal</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18 9 9 0 000-18z"/><path d="M12 12l4-2"/></svg> Panel</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg> Tareas</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg> Correo</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg> Proyectos</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg> Analítica</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg> Campañas</div>

    <div class="navlabel">Leads</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0112 0"/><path d="M16 5a3 3 0 010 6M18 20a6 6 0 00-3-5.2"/></svg> Personas</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5"/></svg> Empresas</div>
    <div class="navi on"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg> Pipeline</div>

    <div class="navlabel">Otros</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg> Formularios</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 013.5-1.8c1.2.5 1.5 2 .5 2.8-.8.6-1.5.9-1.5 2"/><path d="M12 17h.01"/></svg> Ayuda</div>
    <div class="navi"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 00-.1-1.4l2-1.5-2-3.4-2.3 1a7 7 0 00-2.4-1.4L13.8 2h-3.6l-.4 2.3a7 7 0 00-2.4 1.4l-2.3-1-2 3.4 2 1.5A7 7 0 005 12a7 7 0 00.1 1.4l-2 1.5 2 3.4 2.3-1a7 7 0 002.4 1.4l.4 2.3h3.6l.4-2.3a7 7 0 002.4-1.4l2.3 1 2-3.4-2-1.5c.1-.5.1-.9.1-1.4z"/></svg> Ajustes</div>
    <div class="spacer"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div class="savebar"><button class="ghostbtn">Guardar como vista</button></div>
      <div class="h1">Pipeline</div>
      <div class="filters">
        <button class="fbtn"><svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg> Estado</button>
        <button class="fbtn"><svg class="ic sm" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0l-7-7a2 2 0 01-.6-1.4V4a1 1 0 011-1h7.8a2 2 0 011.4.6l7.4 7.4a2 2 0 010 2.4z"/><path d="M7.5 7.5h.01"/></svg> Etiquetas</button>
        <button class="fbtn"><svg class="ic sm" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg> Filtrar</button>
        <span class="clear">Limpiar todo</span>
        <span class="fspace"></span>
        <button class="simbtn" id="simBtn"><svg class="ic sm" viewBox="0 0 24 24"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg> Simular lead nuevo</button>
      </div>
      <div class="subbar">
        <div class="toggle">
          <button><svg class="ic sm" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg> Lista</button>
          <button class="on"><svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="14" rx="1.5"/></svg> Kanban</button>
        </div>
        <div class="money"><span id="mPipe">$0</span> <span class="l">En Pipeline</span> <span class="l">/</span> <span class="g" id="mClosed">$0</span> <span class="l">Cerrado</span></div>
      </div>
    </div>

    <div class="board" id="board"></div>
  </main>
</div>
<div class="toasts" id="toasts"></div>

<script>
// ---------- iconos reutilizables ----------
const I = {
  clock:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cal:'<svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>',
  phone:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012 4.2 2 2 0 014 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1L8 9.6a16 16 0 006 6l1.2-1.1a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6a2 2 0 011.7 2z"/></svg>',
  send:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>',
  globe:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18M12 3a15 15 0 000 18"/></svg>',
  dots:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>',
  plus:'<svg class="ic sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  st_nuevo:'<svg class="ic sm" viewBox="0 0 24 24" stroke-dasharray="3 3"><circle cx="12" cy="12" r="8"/></svg>',
  st_interesado:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>',
  st_cita:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 000 16z" fill="currentColor" stroke="none"/></svg>',
  st_negociacion:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/></svg>',
  st_cerrado:'<svg class="ic sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
};

// ---------- vendedores ----------
const SELLERS = [
  {n:"Dyana",   c:"#2f6dff"}, {n:"Carolina",c:"#7c5cfc"},
  {n:"Roberto", c:"#16b364"}, {n:"Sofía",   c:"#f5a524"}, {n:"Luis", c:"#ef4444"},
];
let assignIdx=0;
const nextSeller=()=>SELLERS[assignIdx++%SELLERS.length];
const initials=n=>n.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();

// ---------- etapas (columnas) ----------
const STAGES=[
  {key:"nuevo",       name:"Nuevo",        color:"#6d5ef0", ic:I.st_nuevo},
  {key:"interesado",  name:"Interesado",   color:"#38a9f0", ic:I.st_interesado},
  {key:"cita",        name:"Cita agendada",color:"#f5a524", ic:I.st_cita},
  {key:"negociacion", name:"Negociación",  color:"#14b8a6", ic:I.st_negociacion},
  {key:"cerrado",     name:"Cerrado 🎉",   color:"#16b364", ic:I.st_cerrado},
];

// ---------- tags por ángulo ----------
const TAG={Retiro:"tag-amber",Inversión:"tag-blue",Familia:"tag-pink",Vacacional:"tag-teal",Reubicación:"tag-purple"};

// ---------- leads de muestra (realistas del proyecto) ----------
let leads=[
  {nm:"Marta P.",   hot:true,  seg:"Retiro",     proy:"Terrazas Villas", bud:550, hrs:1,  date:"01 Abr 2025", stage:"nuevo",       team:["Sofía"]},
  {nm:"Carmen V.",  hot:false, seg:"Familia",    proy:"Napa Village",    bud:150, hrs:9,  date:"31 Mar 2025", stage:"nuevo",       team:["Carolina"]},
  {nm:"Zoraida M.", hot:true,  seg:"Retiro",     proy:"Aquavista",       bud:300, hrs:2,  date:"22 Mar 2025", stage:"interesado",  team:["Dyana","Roberto","Sofía","Luis"]},
  {nm:"Ricardo H.", hot:false, seg:"Inversión",  proy:"Aquavista",       bud:260, hrs:7,  date:"29 Mar 2025", stage:"interesado",  team:["Roberto"]},
  {nm:"Isabel C.",  hot:false, seg:"Vacacional", proy:"Napa Village",    bud:175, hrs:5,  date:"30 Mar 2025", stage:"interesado",  team:["Sofía"]},
  {nm:"Dumas R.",   hot:false, seg:"Inversión",  proy:"Coral Park",      bud:250, hrs:10, date:"26 Mar 2025", stage:"cita",        team:["Carolina","Dyana"]},
  {nm:"Patricia L.",hot:true,  seg:"Inversión",  proy:"Coral Park",      bud:280, hrs:4,  date:"27 Mar 2025", stage:"cita",        team:["Dyana"]},
  {nm:"Alberto G.", hot:false, seg:"Familia",    proy:"Ocean Two",       bud:400, hrs:6,  date:"28 Mar 2025", stage:"negociacion", team:["Roberto","Luis"]},
  {nm:"Gustavo A.", hot:true,  seg:"Familia",    proy:"Ocean Two",       bud:500, hrs:3,  date:"25 Mar 2025", stage:"negociacion", team:["Carolina"]},
  {nm:"Elena T.",   hot:false, seg:"Retiro",     proy:"Aquavista",       bud:200, hrs:12, date:"20 Mar 2025", stage:"cerrado",     team:["Dyana","Sofía","Roberto","Luis"]},
  {nm:"Luis F.",    hot:false, seg:"Vacacional", proy:"Napa Village",    bud:180, hrs:8,  date:"24 Mar 2025", stage:"cerrado",     team:["Roberto"]},
];
const NEW_LEADS=[
  {nm:"Fernando Q.", seg:"Retiro",    proy:"Ocean Two",       bud:420, date:"02 Abr 2025"},
  {nm:"Patricia N.", seg:"Inversión", proy:"Aquavista",       bud:280, date:"02 Abr 2025"},
  {nm:"Gustavo M.",  seg:"Familia",   proy:"Terrazas Villas", bud:500, date:"02 Abr 2025"},
  {nm:"Isabel R.",   seg:"Vacacional",proy:"Napa Village",    bud:190, date:"02 Abr 2025"},
];
let newIdx=0;

const fmtK=n=>"$"+n+"k";
const fmtBig=n=>{const v=n*1000;return v>=1e6?"$"+(v/1e6).toFixed(2)+"M":"$"+Math.round(v/1000)+"K";};

function avatarsHtml(team){
  const show=team.slice(0,3);
  let h='<div class="avatars">';
  show.forEach(name=>{const s=SELLERS.find(x=>x.n===name)||{c:"#94a3b8"};h+=`<span class="av" style="background:${s.c}" title="${name}">${initials(name)}</span>`;});
  if(team.length>3) h+=`<span class="more">${team.length-2}+</span>`;
  return h+'</div>';
}
function cardHtml(l){
  const seller=SELLERS.find(x=>x.n===l.team[0])||SELLERS[0];
  return `<div class="card ${l._new?'newcard':''}">
    <span class="menu">${I.dots}</span>
    <div class="r1">
      <span class="blogo" style="background:${seller.c}">${initials(l.nm)}</span>
      <span class="bname">${l.nm}</span>${l.hot?'<span class="hot">🔥</span>':''}
      <span class="sp"></span>
      <span class="money-pill">${fmtK(l.bud)}</span>
    </div>
    <div class="r2">
      <span class="tag ${TAG[l.seg]}">${l.seg}</span>
      <span class="meta">${I.clock} ${String(l.hrs).padStart(2,'0')} Horas</span>
    </div>
    <div class="r3"><span class="meta">${I.cal} ${l.date}</span><span class="meta"><svg class="ic sm" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg> ${l.proy||"—"}</span></div>
    <div class="foot">
      ${avatarsHtml(l.team)}
      <div class="actions">
        <button title="Llamar">${I.phone}</button>
        <button title="Mensaje">${I.send}</button>
        <button title="Perfil">${I.globe}</button>
      </div>
    </div>
  </div>`;
}
function render(){
  const board=document.getElementById("board");
  board.innerHTML=STAGES.map(st=>{
    const items=leads.filter(l=>l.stage===st.key);
    return `<div class="col">
      <div class="col-bar" style="--c:${st.color}"></div>
      <div class="col-head" style="--c:${st.color}">
        <span class="stage">${st.ic} ${st.name}</span>
        <span class="n">${items.length}</span>
        <span class="sp"></span>
        <span class="act">${I.plus}</span>
        <span class="act">${I.dots}</span>
      </div>
      <div class="cards">${items.map(cardHtml).join("")}</div>
      <button class="add-pipe">${I.plus} Añadir lead</button>
    </div>`;
  }).join("");
  // money summary
  const pipe=leads.filter(l=>l.stage!=="cerrado").reduce((a,l)=>a+l.bud,0);
  const closed=leads.filter(l=>l.stage==="cerrado").reduce((a,l)=>a+l.bud,0);
  document.getElementById("mPipe").textContent=fmtBig(pipe);
  document.getElementById("mClosed").textContent=fmtBig(closed);
}

// ---------- momento matador ----------
document.getElementById("simBtn").addEventListener("click",()=>{
  const base=NEW_LEADS[newIdx++%NEW_LEADS.length];
  const seller=nextSeller();
  const lead={...base,hot:Math.random()>.5,hrs:0,stage:"nuevo",team:[seller.n],_new:true};
  leads.unshift(lead);
  render();
  const board=document.getElementById("board");
  board.scrollLeft=0;
  toast(seller,lead);
  setTimeout(()=>{lead._new=false;},1800);
});
function toast(seller,lead){
  const el=document.createElement("div");
  el.className="toast";
  el.innerHTML=`<b>⚡ Lead nuevo — ${lead.nm}</b>
    <div class="steps">
      <span class="ok">✓</span> Asignado automático a <b>${seller.n}</b><br>
      <span class="ok">✓</span> Correo de bienvenida enviado (Resend)<br>
      <span class="ok">✓</span> Aviso a Telegram de ${seller.n}<br>
      <span class="ok">✓</span> Presupuesto ${fmtK(lead.bud)} · ${lead.seg}
    </div>`;
  document.getElementById("toasts").appendChild(el);
  setTimeout(()=>{el.style.transition="opacity .4s";el.style.opacity="0";setTimeout(()=>el.remove(),400);},4600);
}

render();
</script>
</body>
</html>
